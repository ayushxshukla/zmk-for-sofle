# ---------------------------------------------------------------------------
# Sofle — battery-first config
#   * OLED displays compiled out
#   * RGB underglow available but OFF at boot, and its on/off ALSO switches
#     the VCC rail the LED strip sits on (MEDIA + J toggles both)
#   * Battery reported to the host for BOTH halves
#
# ONE-TIME SETUP: press MEDIA + M (&ext_power EP_TOG) once after flashing.
# ZMK's underglow init does not cut the rail on its own at boot, so until you
# do this the 36 WS2812s keep drawing ~20-35mA while dark. The state is saved
# to flash and restored on every boot afterwards.
# ---------------------------------------------------------------------------

# --- Battery reporting ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Also report the RIGHT (peripheral) half's level to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Works around a battery-reporting bug on Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Lighting: available, but OFF by default ---
CONFIG_ZMK_RGB_UNDERGLOW=y
# Toggling the lights ALSO switches the VCC rail they sit on. This is the whole
# trick: upstream had this set to 'n', which is why the LEDs kept drawing
# ~20-35mA while looking off.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=y
# Boot with the lights off
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
# And drop them again when the keyboard goes idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
CONFIG_ZMK_RGB_UNDERGLOW_BRT_MAX=60
# NOTE: ZMK's underglow init does NOT cut the rail at boot, it only skips the
# animation. Press &ext_power EP_TOG once (MEDIA + M) to actually cut it; that
# state is saved to flash and restored on every boot afterwards.
CONFIG_ZMK_EXT_POWER=y

# --- Displays: OFF ---
CONFIG_ZMK_DISPLAY=n

# --- Sleep / idle ---
# 30 s of inactivity -> idle
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
# 15 min of inactivity -> deep sleep
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000

# --- Keyboard basics ---
CONFIG_ZMK_KEYBOARD_NAME="Sofle"
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Boost BLE transmit power to +8 dBm (nRF52840) for reliable left/right comms.
# Costs a little battery; drop this line if you want the last few percent.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Rotary encoders ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Mouse / pointing ---
CONFIG_ZMK_POINTING=y

# --- ZMK Studio ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
