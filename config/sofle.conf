# ---------------------------------------------------------------------------
# Sofle — battery-first config
#   * RGB underglow (36 WS2812 LEDs) compiled out
#   * OLED displays compiled out
#   * Battery reported to the host for BOTH halves
# NOTE: compiling RGB out does NOT stop the LEDs sipping power. You must also
# press the ext-power key once (MEDIA layer, see README) to cut the VCC rail.
# ---------------------------------------------------------------------------

# --- Battery reporting ---
CONFIG_ZMK_BATTERY_REPORTING=y
CONFIG_ZMK_BATTERY_REPORT_INTERVAL=60
# Also report the RIGHT (peripheral) half's level to the host
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
# Works around a battery-reporting bug on Windows
CONFIG_BT_GATT_ENFORCE_SUBSCRIPTION=n

# --- Lighting: OFF ---
CONFIG_ZMK_RGB_UNDERGLOW=n
# Keep the &ext_power behavior compiled in so you can cut power to the LED strip
CONFIG_ZMK_EXT_POWER=y

# --- Displays: OFF ---
CONFIG_ZMK_DISPLAY=n

# --- Sleep / idle ---
CONFIG_ZMK_IDLE_TIMEOUT=30000          # 30 s of inactivity -> idle
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000   # 15 min of inactivity -> deep sleep

# --- Keyboard basics ---
CONFIG_ZMK_KEYBOARD_NAME="Sofle"
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=5
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

# Boost BLE transmit power to +8 dBm (nRF52840) for reliable left/right comms.
# Costs a little battery; drop this line if you want the last few percent.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# --- Rotary encoders ---
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# --- Mouse / pointing ---
CONFIG_ZMK_POINTING=y

# --- ZMK Studio ---
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n
CONFIG_ZMK_STUDIO_LOCK_ON_DISCONNECT=n
